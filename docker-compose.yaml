services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports: ["5433:5432"]
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6378:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: python -m common.migrate
    environment: &env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/warehouse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }

  inventory_api:
    build: .
    command: python -m inventory_api
    environment: *env
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  analytics_worker:
    build: .
    command: python -m analytics_worker
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
